# Venture Builders Fund — Netlify (static site root)
# Pivot library lives at https://www.watchpivot.tv/

[[redirects]]
  from = "/pivot"
  to = "https://www.watchpivot.tv/"
  status = 301
  force = true

[[redirects]]
  from = "/pivot/"
  to = "https://www.watchpivot.tv/"
  status = 301
  force = true

[[redirects]]
  from = "/pivot.html"
  to = "https://www.watchpivot.tv/"
  status = 301
  force = true

# Unpublished pending counsel review — redirect old URLs to blog index
[[redirects]]
  from = "/blog/beyond-pattern-recognition-how-deep-ecosystem-relationships-surface-better-founders"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/blog/beyond-pattern-recognition-how-deep-ecosystem-relationships-surface-better-founders/"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/blog/beyond-pattern-recognition-how-deep-ecosystem-relationships-surface-better-founders.html"
  to = "/blog"
  status = 301
  force = true

# Accelerator page not public yet. Remove these four rules to launch it.
[[redirects]]
  from = "/foraccelerators"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/foraccelerators/"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/foraccelerators.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/foraccelerators/*"
  to = "/"
  status = 302
  force = true

